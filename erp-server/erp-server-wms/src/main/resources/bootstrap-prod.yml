spring:
  cloud:
    nacos:
      discovery:
        server-addr: 172.16.100.10
        namespace: ${NACOS_NAMESPACE:prod}
      config:
        server-addr: 172.16.100.10
        namespace: prod
        file-extension: yml
        shared-configs: common.yml,db-wms.yml,druid-common.yml,erp-third-party.yml
        extension-configs:
          - data-id: erp-release-control.yml
            group: DEFAULT_GROUP
            refresh: true





