apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-server-srm
  namespace: ${namespace} #namespace
spec:
  replicas: 1
  minReadySeconds: 60  # 从容器启动到应用正常提供服务
  strategy: # k8s更新策略
    type: RollingUpdate #滚动更新
    rollingUpdate:
      maxSurge: 2  # 更新时允许最大激增的容器数，默认 replicas 的 1/4 向上取整
      maxUnavailable: 1  # 更新时允许最大 unavailable 容器数，默认 replicas 的 1/4 向下取整
  template:
    metadata:
      labels:
        app: erp-server-srm
    spec:
      imagePullSecrets: #使用imagePullSecrets参数指定镜像拉取秘钥
        - name: harbor-registry        #使用我们的secret，即harbor-registry
      automountServiceAccountToken: true
      containers:
        - name: erp-server-srm
          image: 172.16.100.92:5000/sdc-erp/erp-server-srm:${tag} #Tag
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "300m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          env:
            - name: JAVA_OPTS
              value: "-Xms1g -Xmx3g -XX:+UseParallelGC -XX:ParallelGCThreads=2"
            - name: TZ
              value: "Asia/Shanghai"  # 设置时区，确保与宿主机一致
          ports:
            - containerPort: 9130 #修改成你项目的端口
          volumeMounts:
            - name: tz
              mountPath: /etc/localtime
      volumes:
        - name: tz
          hostPath:
            path: /etc/localtime
  selector:
    matchLabels:
      app: erp-server-srm
---
apiVersion: v1
kind: Service
metadata:
  name: erp-server-srm
  namespace: ${namespace} #namespace
spec:
  selector:
    app: erp-server-srm
  ports:
    - name: tcp
      # 修改你的项目端口号
      port: 9130
      # 容器暴露的访问端口 要确定与其他服务不冲突
      targetPort: 9130
      nodePort: 30130
  type: NodePort

---

apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-erp-server-srm
  namespace: uat
spec:
  maxReplicas: 2 # 最大扩容到10个节点（pod）
  minReplicas: 1 # 最小扩容1个节点（pod）
  metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 80 # CPU 平局资源使用率达到40%就开始扩容，低于40%就是缩容
          type: Utilization
      type: Resource
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: erp-server-srm