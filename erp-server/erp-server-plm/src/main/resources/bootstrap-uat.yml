spring:
  cloud:
    nacos:
      discovery:
        server-addr: 172.16.100.17
        namespace: ${NACOS_NAMESPACE:uat}
      config:
        server-addr: 172.16.100.17
        namespace: uat
        file-extension: yml
        shared-configs: common.yml,db-plm.yml,erp-third-party.yml,druid-common.yml
        extension-configs:
          - data-id: erp-release-control.yml
            group: DEFAULT_GROUP
            refresh: true
#显示日期的
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8











