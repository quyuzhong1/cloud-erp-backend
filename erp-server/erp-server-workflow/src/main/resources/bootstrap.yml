spring:
  application:
    name: erp-workflow
  profiles:
    active: dev
server:
  port: 9040

logging:
  config: classpath:logback-spring.xml

camunda:
  bpm:
    admin-user:
      id: admin
      first-name: admin
      password: admin
    filter:
      create: All tasks
    webapp:
      application-path: bpm
    auto-deployment-enabled: false
    generic-properties:
      properties:
        javaSerializationFormatEnabled: true
