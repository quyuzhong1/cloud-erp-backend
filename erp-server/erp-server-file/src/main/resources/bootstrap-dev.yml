spring:
  cloud:
    nacos:
      discovery:
        server-addr: 172.16.100.60:32570
        namespace: ${NACOS_NAMESPACE:dev}
        heart-beat-interval: 3
        heart-beat-timeout: 10
      config:
        server-addr: 172.16.100.60:32570
        namespace: dev
        file-extension: yml
        shared-configs: common.yml,db-file.yml,druid-common.yml,erp-third-party.yml
        extension-configs:
          - data-id: erp-release-control.yml
            group: DEFAULT_GROUP
            refresh: true


