spring:
  cloud:
    nacos:
      discovery:
        server-addr: deploy-nacos-0.deploy-nacos-svc.dev.svc.cluster.local
        namespace: ${NACOS_NAMESPACE:dev}
      config:
        server-addr: deploy-nacos-0.deploy-nacos-svc.dev.svc.cluster.local
        namespace: dev
        file-extension: yml
        shared-configs: common.yml,db-dmp.yml,druid-common.yml,erp-third-party.yml
    #显示日期的
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

