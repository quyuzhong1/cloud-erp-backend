spring:
  cloud:
    nacos:
      discovery:
        server-addr: 172.16.100.12
        namespace: dev-lwg
      config:
        server-addr: 172.16.100.12
        namespace: dev
        file-extension: yml
        shared-configs: common.yml,db-dmp.yml
#显示日期的
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

fdfs:
  connect-timeout: 600
  so-timeout: 1500
  tracker-list:
    - 172.16.100.12:22122

config:
  poolConfig:
    pool:
      mabang:
        download:
          corePoolSize: 5
          maxPoolSize: 30
          queueCapacity: 1
          keepAliveSeconds: 10
          poolName: 马帮线程
      gyy:
        download:
          corePoolSize: 5
          maxPoolSize: 30
          queueCapacity: 1
          keepAliveSeconds: 10
          poolName: 管易云线程
      kingdee:
          download:
            corePoolSize: 5
            maxPoolSize: 30
            queueCapacity: 1
            keepAliveSeconds: 10
            poolName: 金蝶云星空线程


