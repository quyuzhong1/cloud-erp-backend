spring:
  cloud:
    nacos:
      discovery:
        server-addr: deploy-nacos-0.deploy-nacos-svc.dev.svc.cluster.local
        namespace: ${NACOS_NAMESPACE:dev}
        heart-beat-interval: 3
        heart-beat-timeout: 10
      config:
        server-addr: deploy-nacos-0.deploy-nacos-svc.dev.svc.cluster.local
        namespace: dev
        file-extension: yml
        shared-configs: common.yml,db-mrp.yml,druid-common.yml
sfs:
  nacos:
    application: seata-server
    server-addr: deploy-nacos-0.deploy-nacos-svc.dev.svc.cluster.local:8848
    namespace: seata-server
    group: SEATA_GROUP





