spring:
  cloud:
    nacos:
      discovery:
        server-addr: 172.16.100.12:8848
        namespace: ${NACOS_NAMESPACE:dev-k8s}
        heart-beat-interval: 3
        heart-beat-timeout: 10
        ip: 172.16.100.60
        port: 30150
      config:
        server-addr: 172.16.100.12:8848
        namespace: dev
        file-extension: yml
        shared-configs: common.yml,db-mrp.yml,druid-common.yml
sfs:
  nacos:
    application: seata-server
    server-addr: 172.16.100.12:8848
    namespace: seata-server
    group: SEATA_GROUP
    ip: 172.16.100.60
    port: 30150





