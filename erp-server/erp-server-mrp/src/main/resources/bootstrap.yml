spring:
  application:
    name: erp-mrp
  profiles:
    active: dev
server:
  port: 9150

logging:
  config: classpath:logback-spring.xml
  level:
    com.alibaba.nacos.client.naming: WARN
    com.alibaba.nacos.client.config.impl: WARN
    io.seata: INFO
    com.zaxxer.hikari: INFO
    com.xxl.job.core.thread.ExecutorRegistryThread: INFO
mybatis-plus:
  type-enums-package: com.common.business.enums;com.erp.model.oms.enums
# 禁用hystrix 避免steata事务失效
feign:
  hystrix:
    enabled: false

seata:
  enabled: true
  application-id : ${spring.application.name}
  tx-service-group: mrp_seata_tx_group
  use-jdk-proxy: true
  data-source-proxy-mode: XA
  enable-auto-data-source-proxy: true
  # TC服务注册中心的配置，微服务根据这些信息去注册中心获取tc服务地址
  registry:
    # 注册中心类型 nacos
    type: nacos
    nacos:
      # seata服务名称
      application: ${sfs.nacos.application}
      # nacos地址
      server-addr: ${sfs.nacos.server-addr}
      # namespace，默认为空
      namespace: ${sfs.nacos.namespace}
      # 配置组
      group: ${sfs.nacos.group}
  config:
    type: nacos
    nacos:
      server-addr: ${sfs.nacos.server-addr}
      group : ${sfs.nacos.group}
      namespace: ${sfs.nacos.namespace}
  service:
    vgroupMapping: # 事务组与cluster的映射关系
      oms_seata_tx_group: default
  client:
    tm:
      default-global-transaction-timeout: 180000


